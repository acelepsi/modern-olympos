name: Classroom regression and emulator tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_CLI_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:all
      - name: Portrait containment in Chrome (synthetic offline fixtures)
        run: node tests/portrait-layout.browser.cjs
      - run: npm run prepare:site
