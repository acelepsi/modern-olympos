<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modern Olympos — Completed Trials</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="marble-bg">

  <header class="site-header">
    <a href="index.html" class="brand">
      <div class="seal-mini">Ω</div>
      <span class="wordmark">Modern Olympos</span>
    </a>

    <nav class="primary-nav" aria-label="Primary">
      <a href="court.html">Trial of the Month</a>
      <a href="archive.html" aria-current="page">Completed Trials</a>
      <a href="who-is-who.html">Who is Who?</a>
    </nav>

    <div class="auth-area">
      <a href="court.html" class="login-btn">Login</a>
    </div>
  </header>

  <main class="archive-page">
    <h1>Completed Trials</h1>
    <p>Explore the mythological cases our classroom has completed. Arguments appear here only after teacher approval. <a href="court.html">Follow the active trial</a>.</p>
    <button id="archive-refresh" type="button">Refresh archive</button>
    <p id="archive-status" role="status" aria-live="polite"></p>
    <ul id="archive-list" aria-label="Completed trials"></ul>
    <section id="archive-detail" hidden aria-labelledby="archive-title">
      <div class="archive-case-heading"><div id="archive-portrait" class="trial-portrait archive-character-portrait">Ω</div><h2 id="archive-title"></h2></div><p id="archive-info"></p>
      <p id="archive-verdict" class="archive-verdict"></p>
      <div class="archive-columns"><section><h3>Prosecution</h3><div id="archive-prosecution"></div></section><section><h3>Defense</h3><div id="archive-defense"></div></section></div>
    </section>
  </main>

<script type="module" src="archive.js"></script>
</body>
</html>
